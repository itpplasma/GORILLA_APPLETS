name: CI

on:
  pull_request:
  merge_group:
  workflow_dispatch:

# Only PR runs share a group; pending push and merge-group runs stay independent.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-24.04

    env:
      FC: gfortran

    steps:
      - name: Checkout GORILLA_APPLETS
        uses: actions/checkout@v6
        with:
          path: GORILLA_APPLETS

      - name: Select GORILLA branch
        id: gorilla_ref
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          # A declared core commit takes precedence over branch-name fallback.
          if [[ -s GORILLA_APPLETS/GORILLA_REF ]]; then
            read -r core_ref < GORILLA_APPLETS/GORILLA_REF
            [[ "$core_ref" =~ ^[0-9a-f]{40}$ ]]
            echo "ref=$core_ref" >> "$GITHUB_OUTPUT"
          elif git ls-remote --exit-code --heads https://github.com/itpplasma/GORILLA.git "$BRANCH" > /dev/null; then
            echo "ref=$BRANCH" >> "$GITHUB_OUTPUT"
          else
            echo "ref=main" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout GORILLA (core dependency)
        uses: actions/checkout@v6
        with:
          repository: itpplasma/GORILLA
          ref: ${{ steps.gorilla_ref.outputs.ref }}
          path: GORILLA

      - name: System dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y gfortran liblapack-dev libnetcdff-dev ninja-build cmake

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install f90nml

      - name: Build
        working-directory: GORILLA_APPLETS
        run: make

      - name: Test
        working-directory: GORILLA_APPLETS
        run: make test
