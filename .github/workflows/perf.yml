name: Performance comparison
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  merge_group:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || format('{0}-{1}', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  perf:
    if: >-
      github.event_name == 'merge_group' || github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.actor != 'github-merge-queue[bot]')
    runs-on: [self-hosted, itp-dispatch]
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Compare both native builds on the same owned Slurm allocation
        env:
          SCI_BASE_SHA: ${{ github.event.merge_group.base_sha || github.event.before || format('origin/{0}', github.event.repository.default_branch) }}
          SCI_HEAD_REF: ${{ github.head_ref || github.ref_name }}
          SCI_OUT: ${{ runner.temp }}/perf-native
        run: |
          export TMPDIR=$RUNNER_TEMP
          SCI_TIER=perf ci/bundle.sh "$RUNNER_TEMP/perf.tar.zst"
          sci-dispatch native "$RUNNER_TEMP/perf.tar.zst"
      - name: Publish timing summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/perf-native/perf-results/report.md" ]; then
            cat "$RUNNER_TEMP/perf-native/perf-results/report.md" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload perf artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-results
          path: ${{ runner.temp }}/perf-native/perf-results/
